<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Hub — MAKAUT B.Tech Exam Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-900/90 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">DSA Hub — Data Structures & Algorithms</h1>
        <p class="text-xs text-slate-400">Module-Wise Quiz Bank • Min 20+ Questions Per Module • Full Explanations</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="electronics-hub.html" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 hover:bg-slate-800">
          Electronics Hub
        </a>
        <button type="button" onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 hover:bg-slate-800">
          Toggle Theme
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- Filter & Score Bar -->
    <div class="p-4 rounded-2xl border border-slate-800 bg-slate-900/70 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-2">
        <label for="moduleFilter" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Module:</label>
        <select id="moduleFilter" onchange="resetAndRender()" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-sm">
          <option value="all">All Modules</option>
          <option value="m1">Module 1: Complexity, Recursion, Arrays & Pointers</option>
          <option value="m2">Module 2: Linked Lists, Stacks & Queues</option>
          <option value="m3">Module 3: Trees & Binary Search Trees</option>
          <option value="m4">Module 4: Hashing, Graphs, Searching & Sorting</option>
        </select>

        <input
          id="topicSearch"
          type="text"
          oninput="resetAndRender()"
          placeholder="Filter subtopic / keyword..."
          class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-sm placeholder:text-slate-400"
        />
      </div>

      <div class="flex items-center gap-3 text-sm">
        <span id="questionCounter" class="font-semibold text-slate-300">0 Questions</span>
        <span id="scoreBadge" class="px-3 py-1 rounded-full bg-brand-600/20 border border-brand-500/40 text-brand-300 font-semibold">
          Score: 0
        </span>
        <button type="button" onclick="resetQuizSession()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 hover:bg-slate-800">
          Reset
        </button>
      </div>
    </div>

    <!-- Quiz Questions List -->
    <div id="dsaQuizContainer" class="space-y-4"></div>

  </main>

  <script>
    const dsaQuizData = [
      // ===== MODULE 1: COMPLEXITY, RECURSION, ARRAYS & POINTERS (20 Qs) =====
      {
        module: "m1", part: "Asymptotic Notation",
        q: "Which asymptotic notation represents the worst-case upper bound of an algorithm's growth rate?",
        options: ["Big-Omega (Ω)", "Big-Theta (Θ)", "Big-O (O)", "Little-omega (ω)"],
        correct: 2,
        explain: "Big-O gives an asymptotic upper bound on growth rate for large input n, commonly used for worst-case analysis."
      },
      {
        module: "m1", part: "Asymptotic Notation",
        q: "Which notation represents a tight asymptotic bound (both upper and lower)?",
        options: ["Big-O", "Big-Omega", "Big-Theta", "Little-o"],
        correct: 2,
        explain: "f(n) = Θ(g(n)) means f(n) is bounded both above and below by constant multiples of g(n) for large n."
      },
      {
        module: "m1", part: "Growth Hierarchy",
        q: "Arrange in increasing order of growth rate as n → ∞: n^2, log n, n, 2^n.",
        options: ["log n, n, n^2, 2^n", "n, log n, n^2, 2^n", "log n, n^2, n, 2^n", "n^2, log n, n, 2^n"],
        correct: 0,
        explain: "Standard growth order for large n: O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(2^n) < O(n!)."
      },
      {
        module: "m1", part: "Loop Complexity",
        q: "What is the time complexity of a single loop running n times with O(1) body work?",
        options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
        correct: 2,
        explain: "Executing O(1) work n times gives O(n) linear time complexity."
      },
      {
        module: "m1", part: "Nested Loops",
        q: "What is the time complexity of two nested loops each running from 1 to n with constant work?",
        options: ["O(n)", "O(n log n)", "O(n^2)", "O(n^3)"],
        correct: 2,
        explain: "Total iterations = n × n = n^2, so time complexity is O(n^2)."
      },
      {
        module: "m1", part: "Logarithmic Complexity",
        q: "A variable starts at n and is halved (k = k / 2) each step until reaching 1. How many steps occur?",
        options: ["n", "n / 2", "Approximately log2(n)", "n^2"],
        correct: 2,
        explain: "Repeatedly dividing n by 2 until reaching 1 takes log2(n) steps, giving O(log n) complexity."
      },
      {
        module: "m1", part: "Space Complexity",
        q: "What is the auxiliary space complexity of iterative binary search on an array of size n?",
        options: ["O(n)", "O(log n)", "O(1)", "O(n log n)"],
        correct: 2,
        explain: "Iterative binary search uses constant extra variables (low, high, mid), taking O(1) auxiliary space."
      },
      {
        module: "m1", part: "Recursion Stack",
        q: "What is the auxiliary call-stack space complexity of recursive factorial(n) with recursion depth n?",
        options: ["O(1)", "O(log n)", "O(n)", "O(2^n)"],
        correct: 2,
        explain: "Each active recursive call pushes a frame onto the call stack up to depth n, taking O(n) space."
      },
      {
        module: "m1", part: "Recursion Base Case",
        q: "What happens if a recursive function has no reachable base case?",
        options: ["Compiler turns it into O(1)", "Infinite recursion leading to stack overflow", "It returns 0 safely", "It converts into a queue"],
        correct: 1,
        explain: "Without a terminating base case, stack frames keep accumulating until stack overflow occurs."
      },
      {
        module: "m1", part: "Recurrence Relation",
        q: "What is the time complexity of T(n) = T(n - 1) + O(1) with T(0) = O(1)?",
        options: ["O(log n)", "O(n)", "O(n log n)", "O(n^2)"],
        correct: 1,
        explain: "Expanding T(n) = T(n-1) + c gives T(0) + n·c = O(n)."
      },
      {
        module: "m1", part: "Master Theorem",
        q: "What is the time complexity of T(n) = 2T(n/2) + O(n)?",
        options: ["O(n)", "O(n log n)", "O(n^2)", "O(log n)"],
        correct: 1,
        explain: "Here a = 2, b = 2, so n^(log_b a) = n^1 matches f(n) = Θ(n), giving Θ(n log n)."
      },
      {
        module: "m1", part: "Array Random Access",
        q: "Why does accessing arr[i] in a 1D array take O(1) time?",
        options: ["Array is sorted", "Elements are stored in contiguous memory", "Array uses hashing", "Indices start at 1"],
        correct: 1,
        explain: "Contiguous memory allows direct address calculation: Base + i × sizeof(element) in O(1) time."
      },
      {
        module: "m1", part: "1D Address Calculation",
        q: "A 1D int array (4 bytes/element) starts at address 2000. What is the address of index 7?",
        options: ["2007", "2024", "2028", "2032"],
        correct: 2,
        explain: "Address = 2000 + 7 × 4 = 2028."
      },
      {
        module: "m1", part: "Array Insertion",
        q: "Worst-case time complexity to insert an element at index 0 of a static array of n elements is:",
        options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
        correct: 2,
        explain: "Existing n elements must shift right by one slot to free index 0, taking O(n) time."
      },
      {
        module: "m1", part: "Row-Major 2D Array",
        q: "In row-major order for 2D array A[R][C] (0-indexed), what is the element offset for A[i][j]?",
        options: ["i * R + j", "i * C + j", "j * R + i", "j * C + i"],
        correct: 1,
        explain: "Each row has C elements in row-major layout, so i complete rows plus j columns gives offset i × C + j."
      },
      {
        module: "m1", part: "Column-Major 2D Array",
        q: "In column-major order for 2D array A[R][C] (0-indexed), what is the element offset for A[i][j]?",
        options: ["i * C + j", "j * R + i", "i * R + j", "j * C + i"],
        correct: 1,
        explain: "Each column has R elements in column-major layout, so j complete columns plus i rows gives offset j × R + i."
      },
      {
        module: "m1", part: "Pointer Arithmetic",
        q: "If int *p is at address 5000 and sizeof(int) = 4, what address does (p + 3) point to?",
        options: ["5003", "5004", "5012", "5016"],
        correct: 2,
        explain: "Pointer arithmetic adds 3 × sizeof(int) = 3 × 4 = 12 bytes, giving 5012."
      },
      {
        module: "m1", part: "Dangling Pointer",
        q: "What is a dangling pointer?",
        options: ["A NULL pointer", "A pointer referencing freed or out-of-scope memory", "A pointer to a constant", "A void pointer"],
        correct: 1,
        explain: "After free(ptr), ptr still holds the old address if not set to NULL; dereferencing it causes undefined behavior."
      },
      {
        module: "m1", part: "Dynamic Allocation",
        q: "Which C function allocates memory for an array and initializes all bytes to zero?",
        options: ["malloc()", "calloc()", "realloc()", "free()"],
        correct: 1,
        explain: "calloc(num, size) allocates num × size bytes and zero-initializes the allocated memory."
      },
      {
        module: "m1", part: "Memory Leak",
        q: "What causes a memory leak?",
        options: ["Using loop counters", "Allocating heap memory without freeing it when no longer reachable", "Using recursion", "Using const"],
        correct: 1,
        explain: "If dynamically allocated memory is never freed and references to it are lost, memory remains leaked until exit."
      }
    ];

    // Separate module batches can be pushed below:
    // dsaQuizData.push(...);
      dsaQuizData.push(// -----------------------------------------------------------------------
// SUB-BLOCK 2: MODULE 2 — Linked Lists, Stacks & Queues (22 Qs)
// -----------------------------------------------------------------------
dsaQuizData.push(
  {
    module: "m2", part: "Linked List Basics",
    q: "Unlike a static array, how are nodes of a dynamic linked list typically organized in memory?",
    options: ["Only in contiguous memory blocks", "In heap nodes connected via pointers", "Inside CPU registers", "In a fixed-size lookup table"],
    correct: 1,
    explain: "Linked list nodes are usually allocated dynamically on the heap and linked using pointers, avoiding contiguous resizing overhead."
  },
  {
    module: "m2", part: "Singly Linked List",
    q: "In a singly linked list with only a head pointer, what is the time complexity to insert a node at the beginning?",
    options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
    correct: 0,
    explain: "Setting newNode->next = head and head = newNode takes constant O(1) time without traversing the list."
  },
  {
    module: "m2", part: "Singly Linked List",
    q: "In a singly linked list with only a head pointer (no tail pointer), what is the time complexity to insert at the end?",
    options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
    correct: 2,
    explain: "Without a tail pointer, traversal must start from head through n nodes to reach the last node, taking O(n) time."
  },
  {
    module: "m2", part: "Singly Linked List",
    q: "What is the worst-case time complexity to search for a value in an unsorted singly linked list of n nodes?",
    options: ["O(1)", "O(log n)", "O(n)", "O(n^2)"],
    correct: 2,
    explain: "Linear traversal from head is required in the worst case (key at the end or not present), taking O(n) time."
  },
  {
    module: "m2", part: "Singly Linked List",
    q: "In a singly linked list, why do you generally need a pointer to the predecessor node to delete a given node?",
    options: ["Pointers cannot be modified", "You need the previous node's next pointer to unlink the target node safely", "Nodes cannot be freed", "It requires sorting first"],
    correct: 1,
    explain: "To unlink a node in a singly linked list, prev->next must be updated to curr->next (unless deleting head)."
  },
  {
    module: "m2", part: "Doubly Linked List",
    q: "Which pointers does each node in a standard doubly linked list maintain?",
    options: ["Only next", "Both prev and next", "Only prev", "next, parent, and child"],
    correct: 1,
    explain: "Each doubly linked list node stores both prev and next pointers, enabling forward and backward traversal."
  },
  {
    module: "m2", part: "Doubly Linked List",
    q: "Given a pointer directly to an interior node in a doubly linked list, why can it be unlinked in O(1) time?",
    options: ["No neighbor pointers exist", "Direct access to prev allows updating prev->next and next->prev in O(1)", "It shifts array elements", "Doubly lists are always sorted"],
    correct: 1,
    explain: "Because curr->prev is directly accessible, curr->prev->next = curr->next and curr->next->prev = curr->prev run in O(1) time."
  },
  {
    module: "m2", part: "Circular Linked List",
    q: "In a circular singly linked list, what does the last node's next pointer reference?",
    options: ["NULL", "head", "A sentinel tail node", "Itself always"],
    correct: 1,
    explain: "In a circular linked list, the last node links back to head instead of NULL, forming a closed loop."
  },
  {
    module: "m2", part: "Pointer Safety",
    q: "Why should you check `ptr != NULL` before dereferencing a linked list node pointer in C?",
    options: ["To speed up loops", "To prevent null-pointer dereference crashes on empty lists or list ends", "Because NULL equals 1", "To convert pointers to integers"],
    correct: 1,
    explain: "Dereferencing a NULL pointer causes undefined behavior or a segmentation fault; checking ptr != NULL keeps traversal and deletion safe."
  },
  {
    module: "m2", part: "Stack Fundamentals",
    q: "Which ordering policy does a stack follow?",
    options: ["FIFO (First-In, First-Out)", "LIFO (Last-In, First-Out)", "Round-Robin", "Sorted Ascending"],
    correct: 1,
    explain: "A stack inserts and removes at the top, so the last pushed element is the first popped (LIFO)."
  },
  {
    module: "m2", part: "Stack Operations",
    q: "What are the time complexities of push() and pop() in both fixed-capacity array and linked-list stacks?",
    options: ["O(n) for both", "O(1) for both", "push is O(n), pop is O(1)", "push is O(1), pop is O(n)"],
    correct: 1,
    explain: "Both array top-index updates and singly-linked head insertions/deletions execute in O(1) time."
  },
  {
    module: "m2", part: "Stack Overflow",
    q: "In an array stack of size MAX where `top` starts at -1, when does stack overflow happen?",
    options: ["When top == -1", "When top == MAX - 1 and push() is called", "When top == 0", "Whenever peek() is called"],
    correct: 1,
    explain: "Valid indices are 0 through MAX - 1; pushing when top == MAX - 1 exceeds capacity and causes overflow."
  },
  {
    module: "m2", part: "Stack Underflow",
    q: "What condition triggers stack underflow?",
    options: ["Pushing onto a full stack", "Popping when the stack has no elements (top == -1)", "Allocating dynamic memory", "Traversing from top to bottom"],
    correct: 1,
    explain: "Attempting to pop or remove from an empty stack (top == -1) causes stack underflow."
  },
  {
    module: "m2", part: "Infix to Postfix",
    q: "What is the postfix expression equivalent to infix `A + B * C`?",
    options: ["A B + C *", "A B C * +", "* + A B C", "A + B C *"],
    correct: 1,
    explain: "Multiplication has higher precedence than addition, so B * C becomes B C *, and A + (B C *) becomes A B C * +."
  },
  {
    module: "m2", part: "Infix to Postfix",
    q: "What is the postfix expression for `(A + B) * (C - D)`?",
    options: ["A B + C D - *", "A B C D + - *", "* + A B - C D", "A B + * C D -"],
    correct: 0,
    explain: "Parentheses evaluate first: (A + B) -> A B + and (C - D) -> C D -, then multiply -> A B + C D - *."
  },
  {
    module: "m2", part: "Postfix Evaluation",
    q: "During postfix evaluation with a stack, when an operator is read, what is the order of popping operands?",
    options: ["Pop one operand only", "Pop top as right operand (op2), then next as left operand (op1)", "Pop bottom element first", "Clear the stack first"],
    correct: 1,
    explain: "Since operands were pushed left-to-right, the first popped value is the right operand (op2) and the second is op1 for non-commutative ops like - and /."
  },
  {
    module: "m2", part: "Stack Applications",
    q: "Which task naturally relies on stack (LIFO) behavior?",
    options: ["Managing function calls/returns & recursion", "Printer job queue spooling", "BFS shortest-path level order", "First-come-first-served ticket line"],
    correct: 0,
    explain: "Nested function calls return in reverse order of invocation (LIFO), matching the call stack."
  },
  {
    module: "m2", part: "Queue Fundamentals",
    q: "Which ordering rule defines a standard queue?",
    options: ["LIFO", "FIFO (First-In, First-Out)", "Highest key first", "Reverse LIFO"],
    correct: 1,
    explain: "A queue enqueues at the rear and dequeues from the front, following First-In, First-Out (FIFO)."
  },
  {
    module: "m2", part: "Linear Array Queue",
    q: "What limitation affects a simple linear array queue after repeated enqueue and dequeue operations?",
    options: ["It cannot store numbers", "rear can hit MAX - 1 while front slots freed by dequeue remain unused", "Dequeue takes O(n) always", "It requires two pointers per element"],
    correct: 1,
    explain: "In a naive linear array queue, front advances forward and leaves empty slots behind it that cannot be reused once rear reaches MAX - 1."
  },
  {
    module: "m2", part: "Circular Queue",
    q: "In a circular queue of capacity N (0-indexed), how is `rear` updated so it wraps around to 0?",
    options: ["rear = rear + 1", "rear = (rear + 1) % N", "rear = (rear - 1) % N", "rear = N / (rear + 1)"],
    correct: 1,
    explain: "Modulo arithmetic (rear + 1) % N wraps index N - 1 back to 0, reusing freed front slots."
  },
  {
    module: "m2", part: "Deque",
    q: "What operations does a Double-Ended Queue (Deque) support?",
    options: ["Insertion and deletion at both front and rear", "Only push and pop at one end", "Only sorted insertion", "Random access by key only"],
    correct: 0,
    explain: "A deque allows inserting and deleting elements at both the front and rear ends."
  },
  {
    module: "m2", part: "Priority Queue",
    q: "In a min-priority queue, which item is removed first upon dequeue?",
    options: ["Most recently inserted item", "Item with the minimum priority/key value", "Middle element", "Oldest item ignoring priority"],
    correct: 1,
    explain: "A min-priority queue always dequeues the element with the smallest priority value first."
  }
);
    let score = 0;
    const answeredMap = new Map();

    function toggleTheme() {
      document.documentElement.classList.toggle("dark");
    }

    function selectOption(globalIdx, optIdx) {
      const q = dsaQuizData[globalIdx];
      if (!q) return;

      const prevChoice = answeredMap.get(globalIdx);
      if (prevChoice === q.correct) score -= 1;

      answeredMap.set(globalIdx, optIdx);
      if (optIdx === q.correct) score += 1;

      document.getElementById("scoreBadge").textContent = `Score: ${score}`;
      renderQuiz();
    }

    function resetQuizSession() {
      score = 0;
      answeredMap.clear();
      document.getElementById("scoreBadge").textContent = "Score: 0";
      renderQuiz();
    }

    function resetAndRender() {
      renderQuiz();
    }

    function renderQuiz() {
      const mod = document.getElementById("moduleFilter").value;
      const query = document.getElementById("topicSearch").value.trim().toLowerCase();
      const container = document.getElementById("dsaQuizContainer");
      const counter = document.getElementById("questionCounter");

      const items = dsaQuizData
        .map((item, idx) => ({ ...item, _idx: idx }))
        .filter(item => {
          const matchMod = (mod === "all" || item.module === mod);
          const matchText = !query ||
            item.q.toLowerCase().includes(query) ||
            item.part.toLowerCase().includes(query) ||
            item.explain.toLowerCase().includes(query);
          return matchMod && matchText;
        });

      counter.textContent = `${items.length} Questions`;

      if (!items.length) {
        container.innerHTML = `<div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/60 text-sm text-slate-400">No DSA questions match the selected filter yet.</div>`;
        return;
      }

      container.innerHTML = items.map((item, i) => {
        const chosen = answeredMap.get(item._idx);
        const hasAnswered = chosen !== undefined;

        return `
          <div class="p-5 rounded-2xl border border-slate-800 bg-slate-900/70 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-semibold">
              <span class="uppercase tracking-wider text-brand-300">${item.module.toUpperCase()} • ${item.part}</span>
              <span class="px-2.5 py-0.5 rounded-full border border-slate-700 text-slate-300">Q${i + 1}</span>
            </div>
            <p class="font-medium text-slate-100">${item.q}</p>
            <div class="space-y-2 text-sm">
              ${item.options.map((opt, oi) => {
                let styleClass = "border-slate-800 bg-slate-950/60 hover:border-slate-700";
                if (hasAnswered) {
                  if (oi === item.correct) styleClass = "border-emerald-500/60 bg-emerald-950/40 text-emerald-200";
                  else if (oi === chosen) styleClass = "border-rose-500/60 bg-rose-950/40 text-rose-200";
                }
                return `
                  <button
                    type="button"
                    onclick="selectOption(${item._idx}, ${oi})"
                    class="w-full text-left px-3.5 py-2 rounded-xl border ${styleClass} transition"
                  >
                    ${opt}
                  </button>
                `;
              }).join("")}
            </div>
            ${hasAnswered ? `
              <div class="p-3.5 rounded-xl border border-slate-700 bg-slate-950/90 text-sm space-y-1">
                <div class="font-semibold ${chosen === item.correct ? "text-emerald-400" : "text-amber-300"}">
                  ${chosen === item.correct ? "Correct!" : `Correct Answer: ${item.options[item.correct]}`}
                </div>
                <p class="text-slate-300">${item.explain}</p>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    renderQuiz();
  </script>
</body>
</html>
